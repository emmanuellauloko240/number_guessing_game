<!DOCTYPE html>
<html>

<head>
<title> Number Guessing Game</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="game-container">
<h1>Number Guessing Game</h1>
<p class="subtitle"> Guess the secret number to win!🤓 </p>
<form method="POST" action="/guess-game">
<p class="message">{{message}}</p>
{% if message == "Correct🥳"%}
<h2>🎉 You won! 🎉</h2>
<p> You guessed it in {{ guess_count }} tries🙃</p>
{% endif %}    
{% if message != "Correct🥳"%}
<!-- <h2>You loose🙂😂</h2> -->
<input type="number" name="guess" required value="{{guess}}">
<button type="submit">Guess</button>
{% endif %}
</form>

<form method="POST" action="/guess-game">
<input type="hidden" name="action" value="restart">
<button type="submit">Play-Again</button>

</form>
</div>
</body>
</html>
